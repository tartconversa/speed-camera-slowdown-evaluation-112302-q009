[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speed_camera_slowdown_evaluation"
version = "0.1.0"
description = "测速摄像头减速策略的效果解释与区域启用（本地合成资料）"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
speed-camera-eval = "speed_camera_slowdown_evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
